<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión seguro para el Panel de Control SIFMA.">
    <title>SIFMA - Iniciar Sesión</title>
    
    <!-- Favicon Oficial SIFMA -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/sifma_sin_texto.svg') }}">
    
    <!-- Google Fonts: Philosopher (marca oficial) + Literata (cuerpo y datos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400;1,7..72,600&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- Google Material Icons Round -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <!-- Estilos Globales Unificados -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body class="login-page-wrapper">
    <div class="login-glass-panel">
        <!-- Logo y Marca Oficial -->
        <div class="login-brand-header">
            <div style="width: 80px; height: 80px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;">
                <img src="{{ url_for('static', filename='img/sifma_sin_texto.svg') }}" alt="SIFMA Emblem" style="width: 100%; height: 100%; display: block;">
            </div>
            <h1>SIFMA</h1>
            <p>Sistema Integrado de Fenotipado y Monitoreo Agronómico</p>
        </div>

        <!-- Alerta de Error -->
        {% if error %}
        <div class="error-alert" style="width: 100%; background: rgba(220, 38, 38, 0.08); border: 1px solid rgba(220, 38, 38, 0.25); color: #b91c1c; border-radius: 10px; padding: 12px 16px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
            <span class="material-icons-round" style="font-size: 20px;">error_outline</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Formulario de Acceso -->
        <form style="width: 100%; display: flex; flex-direction: column; gap: 16px;" method="POST" action="/login">
            <div class="form-group" style="margin-bottom: 0;">
                <label style="font-size: 12.5px; font-weight: 600; color: var(--text-heading); margin-bottom: 6px;">Usuario</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <span class="material-icons-round" style="position: absolute; left: 12px; color: var(--text-muted); font-size: 20px; pointer-events: none;">person</span>
                    <input class="form-control" type="text" name="username" placeholder="Ingresa tu usuario" required autocomplete="username" style="padding-left: 40px;" autofocus>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label style="font-size: 12.5px; font-weight: 600; color: var(--text-heading); margin-bottom: 6px;">Contraseña</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <span class="material-icons-round" style="position: absolute; left: 12px; color: var(--text-muted); font-size: 20px; pointer-events: none;">lock</span>
                    <input class="form-control" type="password" name="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password" style="padding-left: 40px;">
                </div>
            </div>

            <button class="login-btn-submit" type="submit">
                <span class="material-icons-round">login</span>
                <span>Iniciar Sesión</span>
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 11.5px; color: var(--text-muted);">
            Plataforma Segura SIFMA 2026
        </div>
    </div>
</body>
</html>

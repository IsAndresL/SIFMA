<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
    <defs>
        <!-- Gradients -->
        <linearGradient id="sifma-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#064e3b" />
            <stop offset="50%" stop-color="#065f46" />
            <stop offset="100%" stop-color="#022c22" />
        </linearGradient>
        <linearGradient id="sifma-leaf-grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#34d399" />
        </linearGradient>
        <linearGradient id="sifma-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
        <linearGradient id="sifma-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.3" />
        </linearGradient>
        <filter id="sifma-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#10b981" flood-opacity="0.4" />
        </filter>
    </defs>

    <!-- Base Rounded Hexagonal Shield -->
    <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#sifma-bg-grad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Optical Reticle / Computer Vision Grid (Subtle) -->
    <circle cx="50" cy="50" r="38" stroke="url(#sifma-ring-grad)" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="50" cy="50" r="28" stroke="url(#sifma-ring-grad)" stroke-width="0.8" stroke-dasharray="2 4" />
    
    <!-- Reticle Corner Markers (Fenotipado / Calibración de Visión) -->
    <path d="M 22 30 L 22 22 L 30 22" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 78 30 L 78 22 L 70 22" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 22 70 L 22 78 L 30 78" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 78 70 L 78 78 L 70 78" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Organic Botanical Leaves (Foliar Biometrics Structure) -->
    <!-- Left Leaf -->
    <path d="M 50 68 C 30 68 24 50 36 34 C 44 44 48 54 50 58 Z" fill="url(#sifma-leaf-grad)" filter="url(#sifma-glow)" opacity="0.95" />
    <!-- Right Leaf -->
    <path d="M 50 56 C 70 56 76 38 64 22 C 56 32 52 42 50 46 Z" fill="url(#sifma-leaf-grad)" filter="url(#sifma-glow)" opacity="0.95" />
    
    <!-- Leaf Center Ribs (Nervaduras de Datos) -->
    <path d="M 50 68 C 42 56 36 44 36 34" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
    <path d="M 50 56 C 58 44 64 32 64 22" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
</svg>

<!-- SIFMA — Vista Modular: Control de Acceso y Roles del Sistema (Copia fiel de local_server) -->
<div class="user-management-module">
    <div class="widget-card" style="margin-bottom: 20px;">
        <div class="widget-header">
            <div class="widget-header-title">
                <h3>Cuentas de Usuario y Perfiles de Investigación</h3>
                <p>Administración de acceso granular, roles y trazabilidad de operadores de la torre</p>
            </div>
            <button type="button" class="btn btn-primary btn-sm" id="btn-new-user">
                <span class="material-icons-round">person_add</span>
                <span>Nuevo Usuario</span>
            </button>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Rol / Perfil</th>
                        <th>Funciones Habilitadas</th>
                        <th>Correo Electrónico</th>
                        <th>Estado</th>
                        <th>Último Acceso</th>
                        <th style="text-align: right;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="users-table-tbody">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>
</div>

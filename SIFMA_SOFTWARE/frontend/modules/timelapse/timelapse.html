<!-- SIFMA — Vista Modular: Time-Lapse & Evolución Biológica (Copia fiel de local_server) -->
<div class="timelapse-module">
    <div style="display: grid; grid-template-columns: 1fr 340px; gap: 20px; margin-bottom: 24px;">
        <!-- COLUMNA IZQUIERDA: VISOR DE IMÁGENES Y CONTROLES -->
        <div class="widget-card" style="display: flex; flex-direction: column; justify-content: space-between;">
            <!-- Barra de Modos de Vista -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="badge badge-success" id="player-crop-badge" style="font-size: 11px;">
                        Canastilla #1: Cebollín de Rama
                    </span>
                    <span id="player-frame-counter" style="font-size: 12px; font-weight: 700; color: var(--text-heading);">
                        Fotograma 1 / 12
                    </span>
                </div>

                <!-- Selector de Ángulo de Cámara -->
                <div class="filter-group">
                    <button type="button" class="filter-btn active" id="btn-view-cenital">
                        <span class="material-icons-round" style="font-size: 14px;">visibility</span>
                        <span>Cenital</span>
                    </button>
                    <button type="button" class="filter-btn" id="btn-view-lateral">
                        <span class="material-icons-round" style="font-size: 14px;">view_sidebar</span>
                        <span>Lateral</span>
                    </button>
                </div>
            </div>

            <!-- STAGE DE VISUALIZACIÓN DE IMÁGENES CON OVERLAY HUD -->
            <div style="background: #090d16; border-radius: var(--radius-sm); position: relative; min-height: 380px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                <canvas id="timelapseCanvas" width="600" height="380" style="max-width: 100%;"></canvas>
                
                <!-- HUD de Telemetría Flotante Superior -->
                <div style="position: absolute; top: 12px; left: 14px; background: rgba(15, 23, 42, 0.85); color: #ffffff; padding: 4px 10px; border-radius: 4px; font-size: 11.5px; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);">
                    <span class="material-icons-round" style="font-size: 15px; color: var(--accent-success);">calendar_today</span>
                    <strong id="hud-date-text">2026-10-20</strong>
                    <span style="opacity: 0.6;">|</span>
                    <span id="hud-period-text">Día 1 / 12</span>
                </div>
            </div>

            <!-- CONTROLES DE REPRODUCCIÓN Y SCRUBBER -->
            <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; gap: 8px;">
                        <button type="button" class="btn btn-primary btn-sm" id="btn-play-pause">
                            <span class="material-icons-round" id="play-icon">play_arrow</span>
                            <span id="play-text">Reproducir</span>
                        </button>
                        <button type="button" class="btn btn-outline btn-sm" id="btn-reset-timeline" title="Volver al inicio">
                            <span class="material-icons-round">replay</span>
                        </button>
                    </div>

                    <div class="filter-group">
                        <button class="filter-btn active speed-btn" data-speed="500">1x</button>
                        <button class="filter-btn speed-btn" data-speed="250">2x</button>
                        <button class="filter-btn speed-btn" data-speed="100">5x</button>
                    </div>
                </div>

                <div>
                    <input type="range" id="timeline-slider" min="0" max="11" value="0" style="width: 100%; accent-color: var(--accent-success); cursor: pointer;">
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: MÉTRICAS Y GRÁFICA DE CRECIMIENTO -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="widget-card" style="margin-bottom: 0;">
                <div class="widget-header">
                    <h3 style="font-size: 14.5px;">Métricas del Fotograma</h3>
                </div>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border-light); padding-bottom: 6px;">
                        <span style="font-size: 12px; color: var(--text-muted);">Área Foliar</span>
                        <strong style="font-size: 18px; color: var(--accent-success); font-family: var(--font-mono);" id="time-foliar-area">24.00 cm²</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border-light); padding-bottom: 6px;">
                        <span style="font-size: 12px; color: var(--text-muted);">Altura Vegetativa</span>
                        <strong style="font-size: 16px; color: #2563eb; font-family: var(--font-mono);" id="time-height">8.00 cm</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border-light); padding-bottom: 6px;">
                        <span style="font-size: 12px; color: var(--text-muted);">Tasa de Crecimiento</span>
                        <strong style="font-size: 15px; color: #059669; font-family: var(--font-mono);">+1.42 cm²/d</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: baseline;">
                        <span style="font-size: 12px; color: var(--text-muted);">Fase Fenológica</span>
                        <span class="badge badge-success">Vegetativo Activo</span>
                    </div>
                </div>
            </div>

            <!-- CURVA SIGMOIDEA -->
            <div class="widget-card" style="margin-bottom: 0; flex: 1;">
                <div class="widget-header">
                    <h3 style="font-size: 13.5px;">Curva Sigmoidea de Crecimiento</h3>
                </div>
                <div style="height: 160px; position: relative;">
                    <canvas id="timelapseGrowthChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

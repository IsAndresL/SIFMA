[package]
name = "sifma-desktop"
version = "2.0.0"
description = "SIFMA — Sistema Integral de Fenotipado y Monitoreo Agrícola"
authors = ["SIFMA Engineering Team"]
license = "Proprietary"
edition = "2021"
rust-version = "1.80"

[lib]
name = "sifma_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.0" }
tauri-plugin-log = "2.0"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
serialport = "4.5"

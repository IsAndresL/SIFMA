<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Glow filter for premium neon frosted glass look -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Emerald-to-Mint gradient for the outer camera brackets -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    
    <!-- Rich emerald-to-forest gradient for the leaf -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Outer Focus Brackets (Computer Vision Scan Targets) -->
  <g filter="url(#glow)">
    <!-- Top-Left Corner -->
    <path d="M 18 35 L 18 18 L 35 18" fill="none" stroke="url(#bracketGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Top-Right Corner -->
    <path d="M 65 18 L 82 18 L 82 35" fill="none" stroke="url(#bracketGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bottom-Left Corner -->
    <path d="M 18 65 L 18 82 L 35 82" fill="none" stroke="url(#bracketGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bottom-Right Corner -->
    <path d="M 65 82 L 82 82 L 82 65" fill="none" stroke="url(#bracketGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Central Botanical Leaf (Growth / Fenotyping Target) -->
  <g filter="url(#glow)">
    <!-- Leaf Body -->
    <path d="M 50 72 C 34 56 34 33 50 25 C 66 33 66 56 50 72 Z" fill="url(#leafGrad)" />
    <!-- Leaf Inner Spine/Stem -->
    <path d="M 50 70 C 50 56 50 38 50 25" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <!-- Sutil leaf detail lines -->
    <path d="M 50 58 L 57 52" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <path d="M 50 58 L 43 52" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <path d="M 50 48 L 59 40" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <path d="M 50 48 L 41 40" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>
